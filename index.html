<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>to the next 候補生クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage">

  <!-- スタート画面（ジャンル選択） -->
  <section id="screen-start" class="screen active">
    <p class="eyebrow">to the next 候補生クイズ</p>
    <h1 class="title">クイズ選択</h1>
    <p class="lead">挑戦したいクイズを選んでください。</p>
    <ul id="quizList" class="quiz-list"></ul>
  </section>

  <!-- 出題画面 -->
  <section id="screen-quiz" class="screen">
    
    <!-- 進行ライト -->
    <div id="progressTrack" class="progress-track"></div>
    
    <div class="quiz-head">
      <span id="qCounter" class="q-counter">Q1 / 10</span>
      <span id="qScoreLive" class="q-score-live">SCORE 0</span>
    </div>

    <div class="photo-frame">
      <img id="qImage" src="" alt="人物の写真">
    </div>

    <form id="answerForm" class="answer-form" autocomplete="off">
      <p id="answerLabel" class="answer-label">この候補生の名前は？<br>※漢字またはひらがなのフルネーム、姓名の間はスペース無し</p>
      <input type="text" id="answerInput" class="answer-input" placeholder="名前を入力" aria-labelledby="answerLabel" required>
      <div class="answer-buttons">
        <button type="submit" id="btnSubmit" class="btn btn-primary">回答する</button>
        <button type="button" id="btnSkip" class="btn btn-secondary">わからない（スキップ）</button>
      </div>
    </form>

    <div id="feedback" class="feedback" hidden>
      <p id="feedbackResult" class="feedback-result"></p>
      <p id="feedbackAnswer" class="feedback-answer"></p>
      <button id="btnNext" class="btn btn-secondary">次の問題へ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen">
    <p class="eyebrow">RESULT</p>
    <h2 class="title">お疲れさまでした</h2>

    <div class="score-board">
      <span class="score-group">
        <span id="pointsCount" class="score-number">0</span><span class="score-unit">点</span>
        <span class="score-slash">/</span>
        <span id="pointsTotal" class="score-total">0</span><span class="score-unit">点</span>
      </span>
      <span class="score-group">
        <span id="scoreCount" class="score-number-sub">0</span><span class="score-unit-sub">問</span>
        <span class="score-slash-sub">/</span>
        <span id="scoreTotal" class="score-total-sub">0</span><span class="score-unit-sub">問</span>
      </span>
    </div>
    <p id="scoreComment" class="score-comment"></p>

    <ol id="reviewList" class="review-list"></ol>

    <button id="btnRetry" class="btn btn-primary">クイズ選択に戻る</button>
  </section>

</div>

<script src="js/script.js"></script>
</body>
</html>
